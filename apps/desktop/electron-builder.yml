appId: app.boxaide.desktop
productName: Boxaide
copyright: MIT licensed

directories:
  output: release
  buildResources: build

# Named rather than left to electron-builder's by-convention lookup in
# buildResources: a missing icon is otherwise a silent fall back to the stock
# Electron diamond, which ships and is only noticed in the dock.
# Regenerate all three with `npm run icons`.
icon: build/icon.icns

# node_modules for production dependencies is added by electron-builder itself;
# these entries only trim what else goes into the asar.
files:
  - "**/*"
  - "!scripts/**"
  - "!release/**"
  - "!electron-builder.yml"
  # The UI export is shipped unpacked, see extraResources below.
  - "!server/web-next/**"
  # Never loaded at runtime. Zod's `src/` is the TypeScript original of the
  # already-shipped `index.js`.
  - "!**/*.{md,map,d.ts,d.cts,d.mts}"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples}/**"
  - "!**/node_modules/better-sqlite3/{deps,src}/**"
  - "!**/node_modules/zod/src/**"

# `serveStatic` reads the UI with plain fs calls. Keeping the export outside the
# asar means it is a real directory on disk and never goes through Electron's
# asar shim.
extraResources:
  - from: server/web-next
    to: web-next
  # The tray icon must ship OUTSIDE buildResources: electron-builder never
  # packs the `build` directory, and a Tray created from a missing file is an
  # empty, invisible menu bar item. Both sizes travel together so macOS can
  # pick the @2x on retina.
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png

asar: true
# A .node binary cannot be read from inside an asar. Unpack only those files;
# the JS stays in the archive.
asarUnpack:
  - "**/*.node"

# Chromium ships ~50 languages. The app UI is English; unused .lproj packs
# are ~47 MB on disk and a large slice of the dmg.
electronLanguages:
  - en

# Drop leftover native bits electron-builder cannot filter (other-OS
# better-sqlite3 prebuilds, software Vulkan). See the script header.
afterPack: scripts/slim-pack.mjs

# Smaller dmg, slower pack. The download is what the visitor waits on.
compression: maximum

# Rebuilds better-sqlite3 against Electron's ABI while packaging.
npmRebuild: true

# Upload is `gh release`, after this script signs. A GH_TOKEN in the
# environment otherwise makes electron-builder try to publish and crash
# in updateInfoBuilder after the dmg is already written.
publish: null

# Version-free file names, so the download page can link to
# /releases/latest/download/<name> and never be edited again. The names are
# repeated in apps/web/src/app/install/page.tsx — change one, change the other.
mac:
  artifactName: boxaide-mac.dmg
  target: dmg
  category: public.app-category.productivity
  # Signs with the Developer ID Application identity from the login keychain
  # (electron-builder auto-discovers it). Hardened runtime is a notarization
  # prerequisite; the two entitlements are what Electron's JIT needs to run
  # under it.
  # The keychain holds two same-named Developer ID certificates, which makes
  # a by-name --sign ambiguous; the SHA-1 hash pins the newer one (2026-07).
  identity: 403ADC00F0A6E8A510184F01AA2D670FA1988B54
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # scripts/sign-mac.sh notarises, not electron-builder: the app is signed
  # after packaging, so electron-builder would upload an unsigned bundle.
  # One-time setup. The keychain profile name is historical (mailmux-notary).
  #   xcrun notarytool store-credentials mailmux-notary \
  #     --apple-id <apple-id> --team-id 22DPQ7YCAS
  # then build with: APPLE_KEYCHAIN_PROFILE=mailmux-notary npm run dist:mac
  notarize: false

win:
  artifactName: boxaide-windows-setup.exe
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  artifactName: boxaide-linux.AppImage
  target: AppImage
  category: Network
  icon: build/icon.png
