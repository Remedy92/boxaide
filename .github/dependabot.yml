version: 2
updates:
  # The CLI package. Holds the crypto, the IMAP/SMTP clients and the HTTP
  # surface, so its updates matter most.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps; a major still arrives on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Pinned action versions go stale silently and are a supply-chain path.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
